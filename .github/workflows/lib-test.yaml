# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# cspell:ignore mktemp coverprofile covermode
---
name: lib test
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  default:
    name: t
    timeout-minutes: 33
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_ver:
          - "1.25"
          - "1.26"
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: setup go ${{ matrix.go_ver }}
        uses: actions/setup-go@v6 # zizmor: ignore[unpinned-uses]
        with:
          go-version: ${{ matrix.go_ver }}
          check-latest: true
          cache: true
      - name: go test
        run: |
          echo "--- env:"
          go version
          go env
          echo "--- verify:"
          go mod download
          go mod verify
          echo "--- build:"
          go build ./...
          echo "--- vet:"
          go vet ./...
          echo "--- test:"
          cover=$(mktemp /tmp/cover.XXXXXX.out)
          trap 'rm -f "${cover}"' EXIT
          go test -race -count=1 -timeout=120s -coverprofile="${cover}" \
            -covermode=atomic ./...
          echo "--- coverage:"
          pct=$(go tool cover -func="${cover}" | awk '/^total:/{print $3}' | tr -d '%')
          if [[ "${pct}" != "100" && "${pct}" != "100.0" ]]; then
            echo "coverage ${pct}% is not 100%" >&2
            exit 1
          fi
  linters:
    name: linters
    timeout-minutes: 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: lint the repo
        env:
          BRA: master
        run: |
          curl -fsL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/sources/linters-ubuntu-22_04/check-dir.sh | bash
          curl -fsL \
          https://raw.githubusercontent.com/raven428/container-images/refs/heads/${{
          env.BRA }}/sources/ansible-ubuntu/check-dir.sh | bash
  MegaLinter:
    name: MegaLinter
    timeout-minutes: 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: MegaLinter
        uses: oxsecurity/megalinter@v9 # zizmor: ignore[unpinned-uses]
        env:
          VALIDATE_ALL_CODEBASE: true
  all-green:
    name: all green
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - default
      - linters
      - MegaLinter
    if: github.event_name == 'pull_request'
    permissions:
      checks: read
    steps:
      - name: waiting for checks success
        uses: poseidon/wait-for-status-checks@v0.6.0 # zizmor: ignore[unpinned-uses]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: all green
          timeout: 111s
